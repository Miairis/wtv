
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A little surprise ♡</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  overflow: hidden;
  background:
    radial-gradient(circle at 20% 20%, #ffe9f2 0 2px, transparent 3px),
    radial-gradient(circle at 80% 70%, #f7c4d8 0 2px, transparent 3px),
    linear-gradient(135deg, #f8dce7, #f2c4d6, #f9e4ec);
  background-size: 35px 35px, 45px 45px, cover;
  font-family: Georgia, serif;
  color: #713b50;
}

body::before {
  content: "";
  position: fixed;
  inset: 12px;
  border: 1px solid rgba(255,255,255,.75);
  outline: 1px solid rgba(164,92,120,.2);
  outline-offset: 5px;
  pointer-events: none;
}

.card {
  width: min(100%, 440px);
  min-height: 430px;
  padding: 45px 25px;
  background: rgba(255, 250, 252, .78);
  border: 1px solid rgba(255,255,255,.9);
  box-shadow: 0 15px 50px rgba(128, 65, 91, .15);
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
}

.card::before {
  content: "♡  ✧  ♡  ✧  ♡";
  position: absolute;
  top: 17px;
  color: #c17b9b;
  letter-spacing: 8px;
  font-size: 13px;
}

.small {
  font-size: 12px;
  letter-spacing: 4px;
  color: #a66b84;
  text-transform: uppercase;
  margin-bottom: 18px;
}

h1 {
  font-size: clamp(32px, 8vw, 43px);
  font-weight: normal;
  margin: 8px 0 18px;
  color: #713b50;
}

p {
  font-size: 18px;
  line-height: 1.6;
  margin: 8px 0;
}

.heart {
  border: none;
  background: transparent;
  color: #c45e88;
  font-size: 75px;
  cursor: pointer;
  margin-top: 15px;
  transition: transform .3s;
  animation: heartbeat 1.5s infinite;
}

.heart:hover {
  transform: scale(1.15);
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}

button {
  font-family: Georgia, serif;
}

.primary {
  border: 1px solid #bd7794;
  background: #bd7794;
  color: white;
  padding: 12px 30px;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
  margin-top: 20px;
  transition: .2s;
}

.primary:hover {
  background: #a65d7d;
}

.buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-top: 25px;
  min-height: 55px;
  width: 100%;
}

.choice {
  border-radius: 30px;
  padding: 11px 28px;
  font-size: 16px;
  cursor: pointer;
}

.yes {
  border: 1px solid #bd7794;
  background: #bd7794;
  color: white;
}

.no {
  border: 1px solid #bd7794;
  background: transparent;
  color: #8b4b67;
  position: relative;
  transition: left .2s, top .2s;
}

.hidden {
  display: none !important;
}

.result h1 {
  font-size: 38px;
}

.music {
  position: fixed;
  bottom: 25px;
  right: 25px;
  border: 1px solid rgba(255,255,255,.8);
  background: rgba(255,255,255,.55);
  color: #844a65;
  border-radius: 25px;
  padding: 9px 16px;
  font-size: 12px;
  letter-spacing: 1px;
  cursor: pointer;
}

@media (max-width: 480px) {
  .card {
    min-height: 400px;
    padding: 40px 18px;
  }
  .music {
    bottom: 18px;
    right: 18px;
  }
}

/* Floating emojis */
.floating {
  position: fixed;
  bottom: -50px;
  font-size: 30px;
  pointer-events: none;
  z-index: 999;
  animation: floatUp 3.5s ease-out forwards;
}

@keyframes floatUp {
  0% {
    transform: translateY(0) rotate(0deg) scale(.7);
    opacity: 1;
  }
  100% {
    transform: translateY(-110vh) rotate(360deg) scale(1.5);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">

  <!-- INTRO -->
  <section id="intro">
    <div class="small">A LITTLE SURPRISE</div>
    <h1>Hey ho!</h1>
    <p>I have something to tell you...</p>
    <p style="font-size:14px;color:#a66b84;">tap the heart</p>
    <button class="heart" id="heart">♡</button>
  </section>

  <!-- QUESTION -->
  <section id="question" class="hidden">
    <div class="small">JUST ONE QUESTION</div>
    <h1>Sooo...</h1>
    <p>Can I have you for Valentine's?</p>

    <div class="buttons">
      <button class="choice yes" id="yes">YES ♡</button>
      <button class="choice no" id="no">NO</button>
    </div>
  </section>

  <!-- YES RESULT -->
  <section id="yesResult" class="hidden result">
    <div class="small">BEST ANSWER EVER</div>
    <h1>YAYYY ♡</h1>
    <p>You said YES!</p>
    <p>It's a date, then. 🎀</p>
  </section>

  <!-- NO RESULT -->
  <section id="noResult" class="hidden result">
    <div class="small">THAT WAS RUDE</div>
    <h1>FUCK YOU</h1>
    <p>So you don't love me? 🤨</p>
    <p style="font-size:25px;">♡</p>
  </section>

</div>

<button class="music" id="musicBtn">♫ MUSIC ON</button>

<script>
const intro = document.getElementById("intro");
const question = document.getElementById("question");
const yesResult = document.getElementById("yesResult");
const noResult = document.getElementById("noResult");

const heart = document.getElementById("heart");
const yes = document.getElementById("yes");
const no = document.getElementById("no");
const musicBtn = document.getElementById("musicBtn");

let noMoves = 0;
let audioCtx;
let master;
let musicPlaying = false;
let musicTimer;
let noteIndex = 0;

const tempo = 60 / 56;

/* New soft romantic music */
const chords = [
  [196.00, 246.94, 293.66],
  [174.61, 220.00, 261.63],
  [146.83, 185.00, 220.00],
  [164.81, 207.65, 246.94]
];

function playTone(freq, start, duration, volume, type = "sine") {
  if (!audioCtx || !master) return;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);

  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(volume, start + 0.3);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

  osc.connect(gain);
  gain.connect(master);

  osc.start(start);
  osc.stop(start + duration + 0.1);
}

function playChord() {
  const chord = chords[Math.floor(noteIndex / 4) % chords.length];
  const now = audioCtx.currentTime;

  chord.forEach((freq) => {
    playTone(freq / 2, now, 3.5, 0.025);
  });

  const melody = [
    392.00, 493.88, 587.33, 493.88,
    440.00, 523.25, 659.25, 523.25,
    392.00, 493.88, 587.33, 783.99,
    659.25, 587.33, 493.88, 392.00
  ];

  const bell = melody[noteIndex % melody.length];

  playTone(bell, now, 2.2, 0.055);
  playTone(bell * 2, now, 1.2, 0.012);

  const arpeggio = chord[noteIndex % chord.length] * 2;
  playTone(arpeggio, now + tempo * 0.5, 1.4, 0.018);

  noteIndex++;
}

async function startMusic() {
  try {
    if (!audioCtx) {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      audioCtx = new AudioContextClass();

      master = audioCtx.createGain();
      master.gain.value = 0.7;

      const delay = audioCtx.createDelay();
      delay.delayTime.value = 0.45;

      const feedback = audioCtx.createGain();
      feedback.gain.value = 0.22;

      const wet = audioCtx.createGain();
      wet.gain.value = 0.25;

      master.connect(audioCtx.destination);
      master.connect(delay);
      delay.connect(feedback);
      feedback.connect(delay);
      delay.connect(wet);
      wet.connect(audioCtx.destination);
    }

    await audioCtx.resume();

    if (!musicPlaying) {
      musicPlaying = true;
      playChord();
      musicTimer = setInterval(playChord, tempo * 1000);
    }

    musicBtn.textContent = "♫ MUSIC ON";
  } catch (error) {
    musicBtn.textContent = "♫ TAP TO PLAY";
  }
}

function stopMusic() {
  musicPlaying = false;
  clearInterval(musicTimer);

  if (master) {
    master.gain.setTargetAtTime(
      0.0001,
      audioCtx.currentTime,
      0.15
    );
  }

  musicBtn.textContent = "♫ MUSIC OFF";
}

function resumeMusicVolume() {
  if (master && audioCtx) {
    master.gain.setTargetAtTime(
      0.7,
      audioCtx.currentTime,
      0.15
    );
  }
}

/* Floating hearts and emojis */
function createFloating(symbols) {
  for (let i = 0; i < 45; i++) {
    setTimeout(() => {
      const item = document.createElement("div");

      item.className = "floating";
      item.textContent =
        symbols[Math.floor(Math.random() * symbols.length)];

      item.style.left = Math.random() * 100 + "vw";
      item.style.animationDuration = (2.5 + Math.random() * 2) + "s";
      item.style.fontSize = (20 + Math.random() * 30) + "px";

      document.body.appendChild(item);

      setTimeout(() => item.remove(), 5000);
    }, i * 60);
  }
}

heart.addEventListener("click", async () => {
  await startMusic();
  intro.classList.add("hidden");
  question.classList.remove("hidden");
});

musicBtn.addEventListener("click", async () => {
  if (musicPlaying) {
    stopMusic();
  } else {
    await startMusic();
    resumeMusicVolume();
  }
});

yes.addEventListener("click", () => {
  question.classList.add("hidden");
  yesResult.classList.remove("hidden");

  createFloating(["❤️", "💕", "💗", "💖", "💘", "♡"]);
});

function moveNoButton() {
  if (noMoves >= 4) return;

  noMoves++;

  const x = Math.random() * 120 - 60;
  const y = Math.random() * 80 - 40;

  no.style.transform = `translate(${x}px, ${y}px)`;
}

no.addEventListener("pointerenter", (event) => {
  if (event.pointerType === "mouse") {
    moveNoButton();
  }
});

no.addEventListener("touchstart", () => {
  if (noMoves < 4) {
    moveNoButton();
  }
}, { passive: true });

no.addEventListener("click", () => {
  question.classList.add("hidden");
  noResult.classList.remove("hidden");

  createFloating(["🖕", "🖕🏻", "💀"]);
});
</script>

</body>
</html>
